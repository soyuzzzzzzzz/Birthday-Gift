<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-20px);
      }
      60% {
        transform: translateY(-10px);
      }
    }

    .cake-animation {
      animation: bounce 2s infinite;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    img.cake {
      width: 150px;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Happy Birthday Madam Jii 🎉</h1>
    <img src="cake_icon.png" alt="Cake Image" class="cake cake-animation" onclick="showParagraph()">
    <p id="birthdayMessage" class="hidden">Happy Birthday Meri Saanu. Yo chi mero tarfa bata a small birthday gift for you on your special day hai. Hope you like it. 💖</p>
    <a href="question1.html" class="btn hidden">Start the Journey! ✨</a>
  </div>
  <script>
    function showParagraph() {
      const birthdayMessage = document.getElementById("birthdayMessage");
      const startJourneyButton = document.querySelector(".btn");
      birthdayMessage.classList.remove("hidden");
      startJourneyButton.classList.remove("hidden");
    }
  </script>
</body>
</html>

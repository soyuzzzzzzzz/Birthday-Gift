<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question 1</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background-color: #f3e5f5;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: #6a1b9a;
      margin-top: 20px;
    }

    .options {
      margin: 20px 0;
    }

    button {
      background-color: #ab47bc;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
      font-size: 1rem;
    }

    button:hover {
      background-color: #8e24aa;
    }

    #feedback {
      margin-top: 20px;
      font-size: 1.2rem;
      color: #d32f2f;
      display: none;
    }

    #feedback img {
      display: block;
      margin: 20px auto;
      width: 200px;
      border-radius: 10px;
      border: 2px solid #ab47bc;
    }

    .next {
      display: none;
      margin-top: 20px;
    }

    .next a {
      text-decoration: none;
      background-color: #8e24aa;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 1rem;
    }

    .next a:hover {
      background-color: #6a1b9a;
    }
  </style>
</head>
<body>
    <h1> K xa tw mero baby ko halkhabar. Aaaja bata teenage sakyo aba xitai bihe garnu parxa hai timi rw mah ani tw happy happy happy😁😁😁</h1><br>
  <h1>How Happy Are You? 😊</h1>
  <p>Select a number from 1 to 10:</p>
  <div class="options">
    <!-- Buttons for 1 to 10 -->
    <button onclick="checkAnswer(1)">1</button>
    <button onclick="checkAnswer(2)">2</button>
    <button onclick="checkAnswer(3)">3</button>
    <button onclick="checkAnswer(4)">4</button>
    <button onclick="checkAnswer(5)">5</button>
    <button onclick="checkAnswer(6)">6</button>
    <button onclick="checkAnswer(7)">7</button>
    <button onclick="checkAnswer(8)">8</button>
    <button onclick="checkAnswer(9)">9</button>
    <button onclick="checkAnswer(10)">10</button>
  </div>

  <!-- Feedback Section -->
  <div id="feedback">
    <p id="message"></p>
    <img id="photo" src="" alt="Feedback Image">
  </div>

  <!-- Next Page Link -->
  <div class="next">
    <a href="question2.html">Next ➡️</a>
  </div>

  <script>
    function checkAnswer(option) {
      const feedback = document.getElementById("feedback");
      const message = document.getElementById("message");
      const photo = document.getElementById("photo");
      const nextButton = document.querySelector(".next");

      // Reset feedback
      feedback.style.display = "block";
      nextButton.style.display = "none";

      if (option === 10) {
        // Correct Answer
        message.textContent = "Hehe yo honitwww mayaluu. hehehhehehe❤️";
        message.style.color = "#4caf50";
        photo.src = "yes.png"; // Add a success photo
        photo.alt = "Success Photo";
        nextButton.style.display = "block"; // Show next button
      } else {
        // Wrong Answer
        message.textContent = " Aha aha vaena hai birthday ko din ni yesto hunxa. 😒";
        message.style.color = "#d32f2f";
        photo.src = "no.png"; // Add a "Try Again" photo
        photo.alt = "Try Again Photo";
      }
    }
  </script>
</body>
</html>
